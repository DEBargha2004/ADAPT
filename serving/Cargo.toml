[package]
name = "adapt-serving"
version = "0.1.0"
edition = "2021"
description = "ADAPT — Adaptive Decision & Auction Platform for Targeting (serving engine)"

[dependencies]
# Async runtime
tokio = { version = "1.34", features = ["full"] }

# gRPC + Protobuf
tonic = "0.11"
prost = "0.12"

# Feature store (Redis)
redis = { version = "0.25", features = ["tokio-comp"] }

# ONNX Runtime inference
ort = "2.0.0-rc.15"
ndarray = "0.15"

# ANN / HNSW
instant-distance = "0.6"

# Observability
metrics = "0.22"
metrics-exporter-prometheus = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Streaming consumer
rdkafka = { version = "0.36", features = ["cmake-build"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "latency"
path = "benches/latency.rs"
harness = false

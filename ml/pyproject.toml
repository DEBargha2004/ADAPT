[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adapt-ml"
version = "0.1.0"
description = "ADAPT — Adaptive Decision & Auction Platform for Targeting: ML training and evaluation pipeline"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "pandas",
    "scikit-learn",
    "lightgbm",
    "onnx",
    "onnxruntime",
    "duckdb",
    "pyarrow",
    "matplotlib",
    "tqdm",
    "click",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
    "jupyter",
    "ipykernel",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
